<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; object-src 'none';">
  <title>Vela</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <!-- Demo banner in browser preview -->
  <div id="demo-banner" class="demo-banner hidden" role="alert">
    <span class="demo-indicator">●</span>
    <span class="demo-text">示例模式 · 数据仅用于预览（未连接本地 Vela 原生服务）</span>
  </div>

  <div class="app-container">
    <!-- Drag bar for macOS window -->
    <header class="window-titlebar" aria-label="窗口标题栏">
      <div class="titlebar-drag-region">
        <span class="window-title">Vela</span>
        <span id="channel-badge" class="channel-badge">dev</span>
      </div>
      <div class="titlebar-actions">
        <button id="btn-quick-search" class="btn-ghost btn-sm" title="全局搜索 (⌘K)">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <span class="key-hint">⌘K</span>
        </button>
      </div>
    </header>

    <div class="app-body">
      <!-- Fixed Sidebar ~216px -->
      <aside class="sidebar" aria-label="工作台侧边栏">
        <!-- Workspace Switcher -->
        <div class="workspace-switcher">
          <label for="project-selector" class="sr-only">当前工程上下文</label>
          <div class="workspace-select-wrapper">
            <svg class="workspace-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
            <select id="project-selector" class="workspace-select" aria-label="选择项目">
              <option value="">所有项目 (All Projects)</option>
            </select>
          </div>
          <button id="btn-add-project" class="btn-icon-subtle" title="添加项目..." aria-label="添加项目">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          </button>
        </div>

        <!-- Main Navigation (6 Core Modules) -->
        <nav class="sidebar-nav" aria-label="主要功能模块">
          <ul class="nav-list">
            <li class="nav-item">
              <button class="nav-link active" data-page="agents" aria-current="page">
                <svg class="nav-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                <span class="nav-label">Agents</span>
                <span class="nav-sub">会话</span>
                <span class="nav-shortcut">⌘1</span>
              </button>
            </li>
            <li class="nav-item">
              <button class="nav-link" data-page="workflows">
                <svg class="nav-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
                <span class="nav-label">Workflows</span>
                <span class="nav-sub">工作流</span>
                <span class="nav-shortcut">⌘2</span>
              </button>
            </li>
            <li class="nav-item">
              <button class="nav-link" data-page="setup">
                <svg class="nav-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
                <span class="nav-label">Setup</span>
                <span class="nav-sub">配置</span>
                <span class="nav-shortcut">⌘3</span>
              </button>
            </li>
            <li class="nav-item">
              <button class="nav-link" data-page="usage">
                <svg class="nav-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
                <span class="nav-label">Usage</span>
                <span class="nav-sub">用量</span>
                <span class="nav-shortcut">⌘4</span>
              </button>
            </li>
            <li class="nav-item">
              <button class="nav-link" data-page="improve">
                <svg class="nav-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="12" y1="18" x2="12" y2="12"></line><line x1="9" y1="15" x2="15" y2="15"></line></svg>
                <span class="nav-label">Improve</span>
                <span class="nav-sub">调优</span>
                <span class="nav-shortcut">⌘5</span>
              </button>
            </li>
            <li class="nav-item">
              <button class="nav-link" data-page="lab">
                <svg class="nav-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2v7.31L4.65 18.5a2 2 0 0 0 1.7 3.5h11.3a2 2 0 0 0 1.7-3.5L14 9.31V2"></path><line x1="8.5" y1="2" x2="15.5" y2="2"></line><line x1="7" y1="16" x2="17" y2="16"></line></svg>
                <span class="nav-label">Lab</span>
                <span class="nav-sub">实验室</span>
                <span class="nav-shortcut">⌘6</span>
              </button>
            </li>
          </ul>
        </nav>

        <!-- Bottom Status & Actions -->
        <div class="sidebar-bottom">
          <ul class="nav-list">
            <li class="nav-item">
              <button class="nav-link nav-inbox" data-page="inbox">
                <svg class="nav-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"></polyline><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path></svg>
                <span class="nav-label">Inbox</span>
                <span class="nav-sub">待办审批</span>
                <span id="badge-inbox-count" class="badge-count hidden">0</span>
              </button>
            </li>
            <li class="nav-item">
              <button class="nav-link" data-page="settings">
                <svg class="nav-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                <span class="nav-label">Settings</span>
                <span class="nav-sub">设置</span>
                <span class="nav-shortcut">⌘,</span>
              </button>
            </li>
          </ul>

          <div class="local-status-card" id="local-status">
            <div class="status-dot"></div>
            <div class="status-info">
              <div class="status-primary">本地优先 · 无遥测</div>
              <div class="status-secondary" id="store-path-display">~/.vela</div>
            </div>
          </div>
        </div>
      </aside>

      <!-- Main Content Pane -->
      <main class="content-pane" id="main-content" role="main">
        <!-- Error & Info Banners -->
        <div id="global-error" class="alert-banner alert-danger hidden" role="alert">
          <span id="global-error-text"></span>
          <button id="btn-retry-global" class="btn-sm btn-ghost">重试</button>
        </div>

        <!-- Dynamic Page Container -->
        <div id="page-container" class="page-container">
          <div id="initial-loading-view" class="empty-state" style="padding-top: 120px;">
            <div class="empty-state-title" style="color: var(--text-primary); font-size: 14px;">正在连接 Vela 本地工程服务...</div>
            <div class="empty-state-desc" style="font-size: 12px; color: var(--text-secondary);">正在加载本地工程上下文、会话索引与运行记录</div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Detail Split Drawer (Slide-over for inspections) -->
  <div id="drawer-backdrop" class="drawer-backdrop hidden" aria-hidden="true"></div>
  <aside id="detail-drawer" class="detail-drawer hidden" aria-label="详情面板">
    <header class="drawer-header">
      <div class="drawer-title-group">
        <h2 id="drawer-title" class="drawer-title">详情</h2>
        <span id="drawer-subtitle" class="drawer-subtitle"></span>
      </div>
      <div class="drawer-actions">
        <div id="drawer-custom-actions"></div>
        <button id="btn-close-drawer" class="btn-icon-subtle" title="关闭 (Esc)" aria-label="关闭面板">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
    </header>
    <div id="drawer-content" class="drawer-body"></div>
  </aside>

  <!-- Global Modal Dialog Container -->
  <div id="modal-container" class="modal-container hidden" role="dialog" aria-modal="true">
    <div class="modal-backdrop" id="modal-backdrop"></div>
    <div class="modal-dialog" id="modal-dialog">
      <header class="modal-header">
        <h3 id="modal-title" class="modal-title">标题</h3>
        <button id="btn-close-modal" class="btn-icon-subtle" title="关闭 (Esc)" aria-label="关闭对话框">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </header>
      <div id="modal-body" class="modal-body"></div>
      <footer id="modal-footer" class="modal-footer"></footer>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true"></div>

  <!-- Scripts -->
  <script src="app.js"></script>
</body>
</html>
