name: Build and publish preview
on:
  push:
    tags: ['v*-preview.*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: preview-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check:ui
      - run: npm test
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run test:ui
  package:
    needs: browser
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: macos-latest
            arch: arm64
            bundles: app,dmg
          - os: macos-15-intel
            arch: x64
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 1
      RUST_TEST_THREADS: 1
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Preserve completed compilation even when a later native smoke fails.
          save-if: 'true'
      - run: npm ci
      - run: cargo test --locked --workspace -- --test-threads=1
      - run: npm run build -- --bundles ${{ matrix.bundles }}
      - name: Mount DMG, copy application, verify signature and launch
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets "$RUNNER_TEMP/velo-volume" "$RUNNER_TEMP/velo-installed"
          dmg=$(find target/release/bundle/dmg -name '*.dmg' -type f -print -quit)
          test -n "$dmg"
          hdiutil verify "$dmg"
          hdiutil attach "$dmg" -mountpoint "$RUNNER_TEMP/velo-volume" -nobrowse
          trap 'hdiutil detach "$RUNNER_TEMP/velo-volume"' EXIT
          ditto "$RUNNER_TEMP/velo-volume/Velo.app" "$RUNNER_TEMP/velo-installed/Velo.app"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/velo-installed/Velo.app"
          node scripts/assess-macos.mjs "$RUNNER_TEMP/velo-installed/Velo.app" "release-assets/trust-macos-${{ matrix.arch }}.json" --allow-unnotarized-preview
          test -x "$RUNNER_TEMP/velo-installed/Velo.app/Contents/MacOS/vela-hook"
          mkdir -p release-diagnostics
          node -e 'process.stdout.write(String(Date.now()))' > "release-diagnostics/smoke-macos-${{ matrix.arch }}.started-ms"
          node scripts/smoke-installed.mjs "$RUNNER_TEMP/velo-installed/Velo.app/Contents/MacOS/velo" "release-assets/smoke-macos-${{ matrix.arch }}.json"
          cp "$dmg" "release-assets/Velo-macos-${{ matrix.arch }}.dmg"
          updater=$(find target/release/bundle/macos -maxdepth 1 -name '*.app.tar.gz' -type f -print -quit)
          test -n "$updater"
          test -s "$updater.sig"
          cp "$updater" "release-assets/Velo-macos-${{ matrix.arch }}.app.tar.gz"
          cp "$updater.sig" "release-assets/Velo-macos-${{ matrix.arch }}.app.tar.gz.sig"
      - name: Capture only this macOS smoke process crash
        if: ${{ always() && runner.os == 'macOS' }}
        shell: bash
        run: |
          set -euo pipefail
          started="release-diagnostics/smoke-macos-${{ matrix.arch }}.started-ms"
          if test -s "$started"; then
            node scripts/collect-macos-smoke-diagnostic.mjs \
              "$RUNNER_TEMP/velo-installed/Velo.app/Contents/MacOS/velo" \
              "release-diagnostics/smoke-macos-${{ matrix.arch }}-diagnostic.json" \
              "$(cat "$started")" \
              "release-assets/smoke-macos-${{ matrix.arch }}.json"
          fi
      - name: Diagnose failed macOS smoke without a crash report
        if: ${{ always() && runner.os == 'macOS' }}
        shell: bash
        run: |
          set -euo pipefail
          smoke="release-assets/smoke-macos-${{ matrix.arch }}.json"
          if test -s "$smoke"; then
            node scripts/diagnose-macos-smoke-with-lldb.mjs \
              "$RUNNER_TEMP/velo-installed/Velo.app/Contents/MacOS/velo" \
              "$smoke" \
              "release-diagnostics/smoke-macos-${{ matrix.arch }}-diagnostic.json" \
              "release-diagnostics/smoke-macos-${{ matrix.arch }}-lldb.json"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-${{ runner.os }}-${{ matrix.arch }}
          path: release-assets/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'macOS'
        with:
          name: diagnostic-${{ matrix.arch }}
          path: release-diagnostics/
          if-no-files-found: ignore
          retention-days: 7
  publish:
    needs: [browser, package]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: release-assets
      - name: Verify complete artifact set and publish preview
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          test -s Velo-macos-arm64.dmg
          test -s Velo-macos-x64.dmg
          test -s Velo-macos-arm64.app.tar.gz
          test -s Velo-macos-arm64.app.tar.gz.sig
          test -s Velo-macos-x64.app.tar.gz
          test -s Velo-macos-x64.app.tar.gz.sig
          test -s trust-macos-arm64.json
          test -s trust-macos-x64.json
          node -e 'for(const name of ["macos-arm64","macos-x64"]){const r=require("./smoke-"+name+".json");if(!r.success)throw new Error(name)}'
          sha256sum Velo-* > SHA256SUMS.txt
          cd ..
          node scripts/preview-update-feed.mjs release-assets "$RELEASE_TAG" --check
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --prerelease --title "Velo $RELEASE_TAG" --notes-file docs/releases/preview.md
          node scripts/preview-update-feed.mjs release-assets "$RELEASE_TAG" --publish
