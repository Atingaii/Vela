name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    name: macOS build and tests
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and test the real core
        run: swift test
      - name: Repository and website checks
        run: |
          python3 scripts/check-repository.py
          python3 scripts/test-release-resources.py
      - name: JSONL and MCP integration
        run: python3 scripts/test-rpc.py
      - name: Package and audit macOS application
        run: bash scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Vela-macOS-arm64-dev
          path: |
            releases/Vela-macOS-arm64.zip
            releases/SHA256SUMS
          retention-days: 14
