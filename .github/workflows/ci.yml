name: Cross-platform checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [macos-15-intel, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 1
      RUST_TEST_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ !cancelled() }}
      - run: npm ci
      - run: npm run check:ui
      - run: npm test
      - run: cargo test --locked --workspace -- --test-threads=1
      - name: Build debug macOS application and bundled helper
        if: runner.os == 'macOS'
        # PR builds exercise the native app without producing signed updater artifacts.
        # The release workflow keeps createUpdaterArtifacts enabled and supplies the signing key.
        run: >-
          npm run build -- --debug --bundles app
          --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Build debug Windows application and bundled helper
        if: runner.os == 'Windows'
        run: npm run build -- --debug --no-bundle
      - name: Launch isolated native macOS WebView and IPC smoke
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-reports
          app=$(find target/debug/bundle -name Velo.app -type d -print -quit)
          test -n "$app"
          test -x "$app/Contents/MacOS/vela-hook"
          printf '%s\n' "$app/Contents/MacOS/velo" > ci-reports/native-smoke-binary.txt
          node -e 'process.stdout.write(String(Date.now()))' > ci-reports/native-smoke-started-ms.txt
          node scripts/smoke-installed.mjs "$app/Contents/MacOS/velo" ci-reports/native-smoke-macos.json
      - name: Capture only this debug macOS smoke process crash
        if: ${{ always() && runner.os == 'macOS' }}
        shell: bash
        run: |
          set -euo pipefail
          if test -s ci-reports/native-smoke-started-ms.txt; then
            node scripts/collect-macos-smoke-diagnostic.mjs \
              "$(cat ci-reports/native-smoke-binary.txt)" \
              ci-reports/native-smoke-diagnostic.json \
              "$(cat ci-reports/native-smoke-started-ms.txt)" \
              ci-reports/native-smoke-macos.json
          fi
      - name: Diagnose failed macOS smoke without a crash report
        if: ${{ always() && runner.os == 'macOS' }}
        shell: bash
        run: |
          set -euo pipefail
          if test -s ci-reports/native-smoke-binary.txt && test -s ci-reports/native-smoke-macos.json; then
            node scripts/diagnose-macos-smoke-with-lldb.mjs \
              "$(cat ci-reports/native-smoke-binary.txt)" \
              ci-reports/native-smoke-macos.json \
              ci-reports/native-smoke-diagnostic.json \
              ci-reports/native-smoke-lldb.json
          fi
      - name: Launch isolated native Windows WebView and IPC smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ci-reports | Out-Null
          Copy-Item target/release/vela-hook.exe target/debug/vela-hook.exe -Force
          node scripts/smoke-installed.mjs target/debug/velo.exe ci-reports/native-smoke-windows.json
          if ($LASTEXITCODE -ne 0) { throw 'Debug native application failed isolated smoke test' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-smoke-${{ matrix.os }}
          path: ci-reports/
          if-no-files-found: ignore
          retention-days: 7
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:ui
      - name: Check WebKit rendering and interaction
        run: npm run test:ui
        env:
          VELO_WEBKIT: "1"
