<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<style>
  .c-auth{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  .c-auth button{font:inherit;font-size:11px;color:#fff;background:#252525;border:1px solid #555;border-radius:7px;padding:6px 9px;cursor:pointer}
  .c-auth button:hover,.c-auth button:focus-visible{background:#383838;border-color:#aaa}
  .c-auth button:disabled{opacity:.5;cursor:wait}
  .c-auth-status{font-size:10px;line-height:1.4;color:#b9b9b9;margin-top:6px;overflow-wrap:anywhere}
  /* Swift NotchLayout at 117a38b8; design pixels scale by 44 / 117. */
  *{box-sizing:border-box} /* content-box padding once pushed the card past the window's left edge */
  html,body{margin:0;padding:0;width:100%;height:100%;background:transparent;overflow:hidden;user-select:none}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;color:var(--ink,#fff)}
  #root{position:relative;width:100%;height:100%}

  /* The pill on the right edge */
  #pill{
    position:absolute;right:0;top:50%;transform:translateY(-50%);
    width:69.9487px;padding:26.1368px 0 18.8410px;background:#000;
    border-radius:29.6342px 0 0 29.6342px;
    /* Stays visible on dark wallpapers: a thin stroke plus a faint glow, the only outline when black sits on black */
    border:1px solid #2e2e2e;border-right:none;
    box-shadow:none;
    display:flex;flex-direction:column;align-items:center;gap:31.4017px;cursor:pointer;
  }
  /* NotchRootView applies bezelBleed=2pt after sizeScale to the complete
     shape and cells.  The WebView uses zoom for sizeScale, so divide the CSS
     displacement by that scale.  Orb/MoveHandle live outside that Swift view. */
  :root{--bezel-bleed:2px}
  body[data-edge="left"] #pill,body[data-edge="left"] .notch-surface{translate:calc(-1 * var(--bezel-bleed)) 0}
  body[data-edge="right"] #pill,body[data-edge="right"] .notch-surface{translate:var(--bezel-bleed) 0}
  body[data-edge="top"] #pill,body[data-edge="top"] .notch-surface{translate:0 calc(-1 * var(--bezel-bleed))}
  body[data-edge="bottom"] #pill,body[data-edge="bottom"] .notch-surface{translate:0 var(--bezel-bleed)}
  /* Fillets: the concave arcs between the pill's top/bottom and the screen edge (the inverse rounded
     corner in the upstream design frame). An R×R black square hugs the edge and a radial gradient
     punches out the circle of radius R centred on its outer corner; what remains is the arc. A 1 px
     ring in the stroke colour joins the pill's own stroke (the outline cue on black wallpapers). */
  #pill::before,#pill::after{
    content:"";position:absolute;right:0;width:var(--fillet);height:var(--fillet);pointer-events:none;
  }
  /* The Mac's flare radius (38.7 pt against the same 70 pt body), so the settings orb that nests in
     this pocket can be the Mac's own size */
  #pill{--fillet:38.7px}
  #pill::before{
    top:calc(-1 * var(--fillet)); /* covers the 1 px stroke along the pill's top edge so there is no seam */
    background:radial-gradient(circle at 0 0, transparent calc(var(--fillet) - 1.5px), #2e2e2e calc(var(--fillet) - 0.5px), #000 calc(var(--fillet) + 0.5px));
  }
  #pill::after{
    bottom:calc(-1 * var(--fillet));
    background:radial-gradient(circle at 0 100%, transparent calc(var(--fillet) - 1.5px), #2e2e2e calc(var(--fillet) - 0.5px), #000 calc(var(--fillet) + 0.5px));
  }
  .cell{display:flex;flex-direction:column;align-items:center;gap:10.1162px;flex:none;position:relative}
  /* The ring takes the Mac's own share of the body, NotchLayout.ringDiameter against sideBodyDepth: 44 in
     70. At 56 it left an outside weekly ring 2.8 px from the screen edge, where the Mac keeps it about 10
     clear ("far enough in that the bezel is never touched"). The arcs are drawn in a 56-unit viewBox and
     scale with the ring on their own; the glyphs are sized here in px, so they take the same factor. */
  :root{--ring:44px;--k:calc(44 / 56)}
  .ringwrap{position:relative;width:var(--ring);height:var(--ring);transition:transform .3s cubic-bezier(.34,1.4,.64,1)}
  .ringwrap.pressed{transform:scale(.93)}
  .ringwrap > svg.ring,.ringwrap > svg.reading,.ringwrap > svg.activity{position:absolute;inset:0;overflow:visible} /* pins only the ring itself; an inline logo svg must not match this or it ends up in the top-left corner */
  .glyph{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:calc(20px * var(--k));font-weight:700;color:var(--ink,#fff);letter-spacing:-.5px;
  }
  .glyph.small{font-size:calc(15px * var(--k))}
  /* Glyphs: mark = the provider's own brand mark (monochrome, shown white); appicon = the installed app's icon (colour, rounded and shrunk) */
  .glyph img,.glyph svg{display:block;pointer-events:none;user-select:none}
  .glyph .mark{display:block;width:17.2991px;height:17.2991px;color:var(--ink,#fff)}
  .glyph .mark svg{width:17.2991px;height:17.2991px;fill:currentColor} /* inline SVG follows currentColor, so it dims together with the cell */
  .glyph img.png{width:17.2991px;height:17.2991px;object-fit:contain}
  .glyph img.appicon{width:calc(30px * var(--k));height:calc(30px * var(--k));border-radius:calc(8px * var(--k));object-fit:cover}
  .c-head .mark{display:inline-block;width:16px;height:16px;color:var(--ink,#fff);margin-right:2px}
  .c-head .mark svg{width:16px;height:16px;fill:currentColor}
  .pct,.pct-exit{font-size:14.221073px;line-height:17px;font-weight:600;color:var(--ink,#fff);font-variant-numeric:tabular-nums;white-space:nowrap}
  .pct-digit{display:inline-block;will-change:transform,opacity}
  .pct-exit{position:absolute;left:0;right:0;text-align:center;pointer-events:none}
  .glyph.dim{opacity:.35}
  /* A stale reading dims the reading only. The track, the week and the glyph are all saying the same
     old thing, but whether an agent is running right now is current either way, so the activity arc
     keeps its strength — the Mac puts its own ActivityArc outside the opacity it gives the stale
     stack (ProviderRing), and TASKS.md says it outright: dimming applies to the usage reading. */
  .ringwrap.stale > svg.ring,.ringwrap.stale > svg.reading{opacity:.45}
  .ringwrap.stale > .glyph{opacity:.45}
  .ringwrap.stale > .glyph.dim{opacity:.1575}
  @media (prefers-reduced-transparency: reduce){
    .glyph.dim{opacity:.7}
    .ringwrap.stale > svg.ring,.ringwrap.stale > svg.reading{opacity:.75}
    .ringwrap.stale > .glyph{opacity:.75}
    .ringwrap.stale > .glyph.dim{opacity:.525}
  }
  body.reduce-transparency .glyph.dim{opacity:.7}
  body.reduce-transparency .ringwrap.stale > svg.ring,body.reduce-transparency .ringwrap.stale > svg.reading{opacity:.75}
  body.reduce-transparency .ringwrap.stale > .glyph{opacity:.75}
  body.reduce-transparency .ringwrap.stale > .glyph.dim{opacity:.525}
  /* Session arc animation */
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{to{opacity:var(--activity-pulse-min,.3)}}
  /* ProviderRing.SpinningArc uses a compositor-owned continuous 1.1 s turn. Keep the
     animated group in the DOM across quota/activity updates so its phase survives. */
  .arc-spin{animation:spin 1.1s linear infinite;transform-origin:center}
  .arc-pulse{animation:pulse .9s ease-in-out infinite alternate}
  @media (prefers-reduced-transparency: reduce){.arc-pulse{--activity-pulse-min:.65}}
  body.reduce-transparency .arc-pulse{--activity-pulse-min:.65}
  /* Windows' Animation effects switch: a still arc and a solid ring, as on the Mac under Reduce Motion */
  @media (prefers-reduced-motion: reduce){.arc-spin,.arc-pulse{animation:none}.ringwrap{transition:none}}

  /* Hover card, shown to the left of the pill */
  #card,#card-measure{
    position:absolute;left:10px;right:108.6838px;top:50%;transform:translateY(-50%);
    /* Anchored on both sides = fluid width: whatever the WebView's real logical width, the card cannot
       extend past the window's left edge (a fixed max-width got clipped when the DPI disagreed).
       The width follows Swift NotchLayout.cardWidth. */
    max-width:225.6410px;margin-left:auto;background:#000;border-radius:18.6154px;padding:12.0342px;
    overflow-wrap:anywhere;min-width:0;
    max-height:calc(100% - 16px);overflow-x:hidden;overflow-y:auto;scrollbar-width:thin; /* actions stay reachable in a tall card */
    display:none;
  }
  #card.show{display:block}
  .card-crossfade-old{position:absolute;inset:12.0342px;pointer-events:none;z-index:1}
  #card,#card-measure{--secondary:var(--card-secondary,#808080)}
  #card-measure{display:block!important;position:fixed!important;visibility:hidden!important;
    top:0!important;left:0!important;right:auto!important;transform:none!important;
    width:225.641025641px!important;max-height:none!important;height:auto!important;overflow:visible!important;
    margin:0!important;zoom:1!important;pointer-events:none!important}
  /* The shape is the translated Swift path. It owns both curls and body, with no seams. */
  #pill{background:transparent!important;border:0!important}
  #pill::before,#pill::after{display:none}
  .notch-surface{position:absolute;pointer-events:none;fill:#000;overflow:visible}
  body.native-glass:not(.folded) .notch-surface{fill:transparent}
  body.native-glass:not(.folded) #card,body.native-glass:not(.folded) #tail,
  body.native-glass:not(.folded) #orb.hover .h-disc{background:transparent}
  #hardware-band{position:absolute;display:none;pointer-events:none;background:#000}
  body[data-edge="top"].hardware-joined #hardware-band{display:block}
  body[data-edge="top"].hardware-joined #pill{padding-top:calc(12.9744px + var(--hardware-inset,0px));min-width:var(--hardware-min-width,0px)}
  #pill{isolation:isolate}

  /* The tail, its point on the hovered ring: the Mac's curved wedge (TooltipTail), whose shoulders
     leave the card tangent to its edge so the two read as one shape. An element of its own rather
     than ::after, so the card's overflow cannot clip it and it can be reported as hot. It spans the
     whole gap, its tip tucked 1 px under the pill's edge so the two meet. */
  #tail{
    position:absolute;right:80.4786px;width:28.2051px;height:32.7179px;background:#000;display:none;
    clip-path:path('M0 0C0 8.18 16.36 12.43 28.2051 16.359C16.36 20.29 0 24.54 0 32.7179Z');
  }
  #card.show + #tail{display:block}

  .alert-subtitle,.alert-reset,.alert-status{font-size:9.4802px;white-space:nowrap}
  .alert-subtitle,.alert-reset{color:var(--secondary,#808080);overflow:hidden;text-overflow:ellipsis}
  .alert-status{display:flex;align-items:center;gap:4.5128px;margin-top:7.8974px}
  .alert-dot{width:6.0171px;height:6.0171px;border-radius:50%;background:currentColor;flex:none}
  .alert-reset{margin-top:3.0085px}
  .c-sub{font-size:11px;color:var(--secondary,#808080);margin-bottom:10px}

  .w-row{display:flex;justify-content:space-between;align-items:baseline;font-size:9.4802px;flex-wrap:wrap;column-gap:8px}

  .w-track{height:3.9487px;border-radius:2px;background:var(--bar-track,#2d2d2d);margin:6.3179px 0 6.6940px;overflow:hidden}
  .w-fill{height:100%;border-radius:2px}

  .w-pace.deficit{color:#ff9500}
  .g-head{font-size:12px;font-weight:700;color:var(--ink,#fff);margin-top:12px}

  .money-stats,.detail-stats{display:flex;gap:7.5214px;width:100%}
  .money-stat,.detail-stat{flex:1;min-width:0;font-size:9.4802px;line-height:12px}
  .money-stat .label,.detail-stat .label{display:block;color:var(--secondary,#808080);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .money-stat .value,.detail-stat .value{display:block;margin-top:1.5043px;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .detail-chart-bars span{flex:1;min-width:1px;background:var(--secondary,#808080);border-radius:1.5043px 1.5043px 0 0}

  .c-sessions{margin-top:7.5214px;border-top:.9402px solid var(--hairline,#1e1e1e)}

  /* ---- The other three edges -------------------------------------------------
     The rules above draw the right-hand edge, the original layout and still the default. Each block
     below mirrors or rotates that one for another edge. Two things stay in JavaScript because they
     depend on measurement: where the card and the tail sit along the pill (`placeCard`), and, on the
     flat edges, how far down or up the card clears a pill whose thickness follows its contents.

     The fillets follow one rule on every edge: the radial gradient is centred on the corner of the
     R×R square *diagonally opposite* the corner where the pill meets the screen, so what stays black
     is the concave arc between the two. */

  /* Left: the right-hand layout mirrored. */
  body[data-edge="left"] #pill{right:auto;left:0;border-radius:0 29.6342px 29.6342px 0;border-right:1px solid #2e2e2e;border-left:none}
  body[data-edge="left"] #pill::before,body[data-edge="left"] #pill::after{right:auto;left:0}
  body[data-edge="left"] #pill::before{background:radial-gradient(circle at 100% 0, transparent calc(var(--fillet) - 1.5px), #2e2e2e calc(var(--fillet) - 0.5px), #000 calc(var(--fillet) + 0.5px))}
  body[data-edge="left"] #pill::after{background:radial-gradient(circle at 100% 100%, transparent calc(var(--fillet) - 1.5px), #2e2e2e calc(var(--fillet) - 0.5px), #000 calc(var(--fillet) + 0.5px))}
  body[data-edge="left"] #card{left:108.6838px;right:10px;margin-left:0;margin-right:auto}
  body[data-edge="left"] #tail{right:auto;left:80.4786px;clip-path:path('M28.2051 0C28.2051 8.18 11.85 12.43 0 16.359C11.85 20.29 28.2051 24.54 28.2051 32.7179Z')}

  /* Top and bottom: the pill lies flat, so it is a row and its thickness comes from the cells rather
     than a fixed 70 px column. The card is centred under (or over) the hovered ring by `placeCard`. */
  body[data-edge="top"] #pill,body[data-edge="bottom"] #pill{
    right:auto;left:50%;top:auto;transform:translateX(-50%);
    flex-direction:row;width:auto;height:auto;padding:12.9744px 22.4889px;
  }
  body[data-edge="top"] #pill::before,body[data-edge="top"] #pill::after,
  body[data-edge="bottom"] #pill::before,body[data-edge="bottom"] #pill::after{right:auto;top:auto;bottom:auto}
  body[data-edge="top"] #pill{top:0;border-radius:0 0 29.6342px 29.6342px;border-top:none}
  body[data-edge="top"] #pill::before{top:0;left:calc(-1 * var(--fillet));background:radial-gradient(circle at 0 100%, transparent calc(var(--fillet) - 1.5px), #2e2e2e calc(var(--fillet) - 0.5px), #000 calc(var(--fillet) + 0.5px))}
  body[data-edge="top"] #pill::after{top:0;right:calc(-1 * var(--fillet));background:radial-gradient(circle at 100% 100%, transparent calc(var(--fillet) - 1.5px), #2e2e2e calc(var(--fillet) - 0.5px), #000 calc(var(--fillet) + 0.5px))}
  body[data-edge="bottom"] #pill{bottom:0;border-radius:29.6342px 29.6342px 0 0;border-bottom:none}
  body[data-edge="bottom"] #pill::before{bottom:0;left:calc(-1 * var(--fillet));background:radial-gradient(circle at 0 0, transparent calc(var(--fillet) - 1.5px), #2e2e2e calc(var(--fillet) - 0.5px), #000 calc(var(--fillet) + 0.5px))}
  body[data-edge="bottom"] #pill::after{bottom:0;right:calc(-1 * var(--fillet));background:radial-gradient(circle at 100% 0, transparent calc(var(--fillet) - 1.5px), #2e2e2e calc(var(--fillet) - 0.5px), #000 calc(var(--fillet) + 0.5px))}
  /* A fixed width here, not the fluid one the upright edges use: `placeCard` measures the card to
     centre it, and a shrink-to-fit width would change as it moves. The width follows Swift NotchLayout.cardWidth on every edge. */
  body[data-edge="top"] #card,body[data-edge="bottom"] #card{
    left:8px;right:auto;top:0;transform:none;margin-left:0;
    width:225.6410px;max-height:calc(100% - 150px);
  }
  body[data-edge="top"] #tail,body[data-edge="bottom"] #tail{right:auto;width:36px;height:32px}
  body[data-edge="top"] #tail{clip-path:path('M0 28.2051C8.18 28.2051 12.43 11.85 16.359 0C20.29 11.85 24.54 28.2051 32.7179 28.2051Z')}
  body[data-edge="bottom"] #tail{clip-path:path('M0 0C8.18 0 12.43 16.36 16.359 28.2051C20.29 16.36 24.54 0 32.7179 0Z')}

  #card{left:auto;right:var(--card-seam,108.6838px);width:225.641025641px;margin:0;max-height:none}
  body[data-edge="left"] #card{left:var(--card-seam,108.6838px);right:auto}
  #tail{right:calc(var(--card-seam,108.6838px) - 28.205128205px)}
  body[data-edge="left"] #tail{left:calc(var(--card-seam,108.6838px) - 28.205128205px);right:auto}
  body[data-edge="top"] #card,body[data-edge="bottom"] #card{right:auto;max-height:none}
  body[data-edge="top"] #tail,body[data-edge="bottom"] #tail{width:32.717948718px;height:28.205128205px}

  /* Show on hover, the Mac's .onHover: folded, the notch rests as a small pill at the edge. Its size is
     the Mac's NotchLayout.pillWidth × pillHeight, 26 × 210 of its design px — 10 × 79 of this page's,
     the same unscaled measures the orb and the fillets use. The open pill keeps its whole layout and is
     clipped down to that, so everything measured off it (the card's anchor, the handles, which ring is
     under the pointer) stays true; `#rest` draws the outline the clip takes away, which is the only

  .h-disc{width:46.6px;height:46.6px;margin:-23.3px 0 0 -23.3px;border-radius:50%;background:#000;border:1px solid #2e2e2e;opacity:0;transform:scale(1.1)}
  .h-glyph{width:21px;height:21px;margin:-10.5px 0 0 -10.5px;fill:var(--ink,#fff);opacity:0;
    transform:rotate(calc(var(--spins,0) * 360deg - 60deg)) scale(.5);transition:opacity .2s,transform .55s cubic-bezier(.34,1.2,.64,1)}

  .handle.hover .h-disc{opacity:1;transform:scale(1)}
  .handle.hover .h-glyph{opacity:1;transform:rotate(calc(var(--spins,0) * 360deg)) scale(1)}

  #move.armed .h-disc{border:2px dashed #e8e8ea;background:rgba(0,0,0,.72)}

     directions mirrored along the stack at the near end */

  body[data-edge="bottom"] #orb{--arc:90deg}

  body[data-edge="top"] #move{--arc:270deg}

function svgArc(r,frac,color,width,extra=''){
  // Nothing at all at zero: a zero-length dash still paints a dot once the caps are round, where the
  // Mac's `trim(from: 0, to: 0)` draws nothing. A reading small enough that its two caps meet does
  // draw as a dot, on both platforms — `ProviderRing.sweep` has no floor. Upstream #260 argues that
  // is wrong, for the local model's arc; if it lands, the same floor belongs here.
  if(!(frac>0)) return '';
  const C=2*Math.PI*r;
  return `<circle cx="28" cy="28" r="${r}" fill="none" stroke="${color}" stroke-width="${width}"
    stroke-dasharray="${(C*frac).toFixed(2)} ${C.toFixed(2)}" stroke-linecap="round"
    transform="rotate(-90 28 28)" ${extra}/>`;
}

function dashedArc(r,f,color){

  for(let start=0;start<circumference*Math.max(0,f);start+=dash+gap){

function resetCopy(ms){
  if(!ms) return '';
  const diff=ms-Date.now();
  if(diff<=0) return ui().resetting;
  const min=Math.round(diff/60000); // rounded before the test, so 59m40s never reads "Resets in 60 min"
  if(appearance.reset_time==='remaining'){
    const minutes=Math.max(1,min),hours=Math.floor(minutes/60),days=Math.floor(hours/24);
    if(days>0)return textCopy(`Resets in ${days} ${days===1?'Day':'Days'} ${hours%24}h`);
    if(hours>0)return textCopy(`Resets in ${hours}h ${minutes%60}m`);
    return ui().resetsIn(minutes);
  }
  if(min<60) return ui().resetsIn(Math.max(1,min));
  const d=new Date(ms), locale=ui().locale;
  // A weekday only names a day in the coming week: a Codex monthly reset 26 days out read as this Monday
  if(daysApart(Date.now(),ms)>=7) return ui().resetsDate(d.toLocaleDateString(locale,{month:'short',day:'numeric'}));
  const t=d.toLocaleTimeString(locale,{hour:'numeric',minute:'2-digit',hourCycle:stateSnap.clock_24h?'h23':'h12'});
  if(diff<24*60*60*1000) return ui().resetsAt(t);
  return ui().resetsOn(d.toLocaleDateString(locale,{weekday:'short'}),t);
}
// Calendar days rather than 24-hour blocks, so a clock change cannot move the answer
function daysApart(from,to){
  const day=ms=>{const d=new Date(ms); return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();};
  return Math.round((day(to)-day(from))/86400000);
}

function ago(ms){
  const m=Math.round((Date.now()-ms)/60000);
  return ui().ago(m);
}

  systemAccent=event.payload;renderRing();if(card.classList.contains('show'))renderCard();
}).catch(()=>{});
function acceptAppearance(prefs){if(prefs){appearance={...appearance,...prefs};scheduleFold(fullscreen);renderRing();if(card.classList.contains('show'))renderCard();if(card.classList.contains('show')&&providers().find(p=>p.id===hoverId)?.base==='deepseek')refreshDeepSeekPricing();queueNativeSurface();}}
invoke('get_appearance').then(acceptAppearance).catch(()=>{});
listen('appearance',e=>acceptAppearance(e.payload)).catch(()=>{});
function acceptProviders(rows){const previous=new Map(extraProviders.map(p=>[p.id,JSON.stringify(p.snap)]));extraProviders=Array.isArray(rows)?rows:[];for(const p of extraProviders){if(previous.get(p.id)!==JSON.stringify(p.snap))settle(p.id);}renderRing();if(card.classList.contains('show'))renderCard();}
invoke('get_providers').then(acceptProviders).catch(()=>{});
listen('providers',e=>acceptProviders(e.payload)).catch(()=>{});
invoke('get_disabled_providers').then(v=>{disabledProviders=Array.isArray(v)?v:[];renderRing();}).catch(()=>{});
listen('disabled_providers',e=>{disabledProviders=e.payload||[];renderRing();}).catch(()=>{});
listen('usage',e=>{usage=e.payload||usage;claudeActionMessage='';settle('claude');renderRing();if(card.classList.contains('show'))renderCard();})
  .catch(e=>notice('listen(usage) failed: '+e));
listen('state',e=>{stateSnap=e.payload||stateSnap;setUiLanguage(stateSnap.lang_resolved);renderRing();if(card.classList.contains('show'))renderCard();})
  .catch(e=>notice('listen(state) failed: '+e));
listen('notice',e=>notice(e.payload)).catch(()=>{});
listen('codex',e=>{codexSnap=e.payload||codexSnap;settle('codex');renderRing();if(card.classList.contains('show'))renderCard();}).catch(()=>{});
listen('cursor',e=>{cursorSnap=e.payload||cursorSnap;settle('cursor');renderRing();if(card.classList.contains('show'))renderCard();}).catch(()=>{});
invoke('get_cursor').then(u=>{cursorSnap=u||cursorSnap;renderRing();}).catch(()=>{});
listen('grok',e=>{grokSnap=e.payload||grokSnap;settle('grok');renderRing();if(card.classList.contains('show'))renderCard();}).catch(()=>{});
invoke('get_grok').then(u=>{grokSnap=u||grokSnap;renderRing();}).catch(()=>{});

listen('antigravity',e=>{agSnap=e.payload||agSnap;settle('gemini');renderRing();if(card.classList.contains('show'))renderCard();}).catch(()=>{});
invoke('get_antigravity').then(u=>{agSnap=u||agSnap;renderRing();}).catch(()=>{});
listen('glm',e=>{glmSnap=e.payload||glmSnap;renderRing();if(card.classList.contains('show'))renderCard();}).catch(()=>{});
invoke('get_glm').then(u=>{glmSnap=u||glmSnap;renderRing();}).catch(()=>{});
invoke('get_notch_slots').then(v=>{notchSlots=Array.isArray(v)?v:null;renderRing();}).catch(()=>{});
listen('notch_slots',e=>{
  notchSlots=Array.isArray(e.payload)?e.payload:null;
  renderRing();
  if(card.classList.contains('show')){renderCard();armWatchdog();}
}).catch(()=>{});
invoke('get_antigravity_prefs').then(p=>{if(p){agPrefs=p;renderRing();}}).catch(()=>{});
invoke('get_weekly_ring').then(v=>{if(typeof v==='string'){weeklyRing=v;renderRing();}}).catch(()=>{});
listen('weekly_ring',e=>{if(typeof e.payload==='string'){weeklyRing=e.payload;renderRing();}}).catch(()=>{});
listen('antigravity_prefs',e=>{if(e.payload){agPrefs=e.payload;renderRing();}}).catch(()=>{});
listen('glyphs',e=>{glyphs=e.payload||glyphs;glyphEpoch++;renderRing();if(card.classList.contains('show'))renderCard();}).catch(()=>{});
listen('activity',e=>{activity=e.payload||activity;renderRing();if(card.classList.contains('show'))renderCard();}).catch(()=>{});
invoke('get_activity').then(a=>{activity=a||activity;renderRing();}).catch(()=>{});
invoke('get_glyphs').then(g=>{glyphs=g||glyphs;glyphEpoch++;renderRing();}).catch(()=>{});
// The edge: pushed on every placement (a drag that snapped elsewhere, or Settings), and asked for once
// at startup in case the placement happened before this page was listening.
listen('notch_edge',e=>applyEdge(e.payload)).catch(()=>{});
listen('native_notch_geometry',e=>applyHardwareNotch(e.payload)).catch(()=>{});
invoke('get_native_notch_geometry').then(applyHardwareNotch).catch(()=>{});
// applyEdge measures for the edge it is given; on the right-hand one it returns early, so the first
// measurement is made here either way — and still made if the ask fails, from the default edge.
invoke('get_notch_edge').then(e=>{applyEdge(e);reportDpr();}).catch(()=>reportDpr());
invoke('get_codex').then(u=>{codexSnap=u||codexSnap;renderRing();}).catch(()=>{});
invoke('get_usage').then(u=>{usage=u||usage;renderRing();}).catch(e=>notice('get_usage failed: '+e));
invoke('get_state').then(s=>{stateSnap=s||stateSnap;setUiLanguage(stateSnap.lang_resolved);renderRing();}).catch(()=>{});
setInterval(renderRing,30_000); // stale state and reset copy move with time
setInterval(async()=>{
  if(!claudeAuth.busy&&!(hoverId==='claude'&&card.classList.contains('show'))) return;
  try{
    const next=await invoke('get_claude_auth');
    if(JSON.stringify(next)!==JSON.stringify(claudeAuth)){
      claudeAuth=next;
      if(hoverId==='claude'&&card.classList.contains('show')){renderCard();armWatchdog();}
    }
  }catch(_){} // Local IPC only; no network requests and no automatic browser launch.
},2000);
</script>
</body>
</html>
